name: Actualizar cámaras

on:
  schedule:
    - cron: "0 8 * * 1"   # lunes 8:00 UTC (5:00 en Buenos Aires)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bajar las fuentes y armar la base
        run: python -I herramientas/actualizar_base.py
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publicar datos
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Base de cámaras revisada $(date -u +%F)"
          git push
